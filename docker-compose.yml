services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: scheduler-web
    restart: unless-stopped
    environment:
      RUN_WEB_APP: "true"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "5000"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-}"
      SQLITE_PATH: "/data/scheduler.db"
      GOOGLE_CALENDAR_SYNC_ENABLED: "${GOOGLE_CALENDAR_SYNC_ENABLED:-true}"
      GOOGLE_CALENDAR_SYNC_RETRY_COUNT: "${GOOGLE_CALENDAR_SYNC_RETRY_COUNT:-2}"
      GOOGLE_CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-primary}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b-instruct}"
      SPEECH_SERVICE_URL: "http://speech:8090"
      GOOGLE_OAUTH_REDIRECT_HOST: "127.0.0.1"
      GOOGLE_OAUTH_REDIRECT_PORT: "5000"
      GOOGLE_OAUTH_CLIENT_SECRETS_FILE: "/app/oauth_client_secret.json"
      GOOGLE_SERVICE_ACCOUNT_FILE: "/app/credentials.json"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
    ports:
      - "5000:5000"
    volumes:
      - scheduler_data:/data
      - ./credentials.json:/app/credentials.json:ro
      - ./oauth_client_secret.json:/app/oauth_client_secret.json:ro
    depends_on:
      speech:
        condition: service_started
      ollama:
        condition: service_started

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    container_name: scheduler-speech
    restart: unless-stopped
    environment:
      SPEECH_HOST: "0.0.0.0"
      SPEECH_PORT: "8090"
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      TTS_PROVIDER: "coqui"
      TTS_MODEL_NAME: "${TTS_MODEL_NAME:-tts_models/es/css10/vits}"
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: scheduler-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b-instruct}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull "$OLLAMA_MODEL"
        wait
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  scheduler_data:
  ollama_data:
